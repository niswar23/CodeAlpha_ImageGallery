<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Image Gallery</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

    <header>

        <h1>Image Gallery</h1>

        <p>Explore some beautiful places and moments</p>

    </header>


    <!-- Filter Buttons -->

    <div class="filters">

        <button onclick="filterImages('all')">All</button>

        <button onclick="filterImages('nature')">Nature</button>

        <button onclick="filterImages('city')">City</button>

        <button onclick="filterImages('animals')">Animals</button>

    </div>


    <!-- Gallery -->

    <div class="gallery">

        <div class="gallery-item nature">

            <img src="images/image1.jpg"
                 alt="Nature"
                 onclick="openLightbox(0)">

        </div>


        <div class="gallery-item nature">

            <img src="images/image2.jpg"
                 alt="Nature"
                 onclick="openLightbox(1)">

        </div>


        <div class="gallery-item nature">

            <img src="images/image3.jpg"
                 alt="Nature"
                 onclick="openLightbox(2)">

        </div>


        <div class="gallery-item city">

            <img src="images/image4.jpg"
                 alt="City"
                 onclick="openLightbox(3)">

        </div>


        <div class="gallery-item city">

            <img src="images/image5.jpg"
                 alt="City"
                 onclick="openLightbox(4)">

        </div>


        <div class="gallery-item city">

            <img src="images/image6.jpg"
                 alt="City"
                 onclick="openLightbox(5)">

        </div>


        <div class="gallery-item animals">

            <img src="images/image7.jpg"
                 alt="Animal"
                 onclick="openLightbox(6)">

        </div>


        <div class="gallery-item animals">

            <img src="images/image8.jpg"
                 alt="Animal"
                 onclick="openLightbox(7)">

        </div>


        <div class="gallery-item animals">

            <img src="images/image9.jpg"
                 alt="Animal"
                 onclick="openLightbox(8)">

        </div>

    </div>


    <!-- Lightbox -->

    <div id="lightbox" class="lightbox">

        <span class="close" onclick="closeLightbox()">×</span>

        <button class="previous" onclick="previousImage()">❮</button>

        <img id="lightboxImage" src="" alt="Large image">

        <button class="next" onclick="nextImage()">❯</button>

    </div>


    <script src="script.js"></script>

</body>

</html>
